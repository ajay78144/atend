<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance System Backend</title>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Fira+Code:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg: #0b0f19;
            --card-bg: #111827;
            --border: #1f2937;
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #f9fafb;
            --text-muted: #9ca3af;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: var(--bg);
            color: var(--text-main);
            min-height: 100vh;
            padding: 24px;
        }

        .container { max-width: 900px; margin: 0 auto; }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
            padding-bottom: 20px;
            border-bottom: 1px solid var(--border);
            margin-bottom: 24px;
        }

        .logo-area h1 {
            font-size: 1.5rem;
            background: linear-gradient(135deg, #a5b4fc, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            background: rgba(16, 185, 129, 0.15);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.3);
            padding: 6px 12px;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 600;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            background: var(--success);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--success);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
            margin-bottom: 24px;
        }

        .card-header {
            margin-bottom: 18px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        @media (max-width: 600px) {
            .form-grid { grid-template-columns: 1fr; }
        }

        .form-group { margin-bottom: 14px; }

        label {
            display: block;
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-muted);
            margin-bottom: 6px;
        }

        input, select {
            width: 100%;
            background: #1f2937;
            border: 1px solid #374151;
            padding: 10px 12px;
            border-radius: 8px;
            color: #fff;
            font-family: inherit;
            font-size: 0.9rem;
            outline: none;
        }

        input:focus, select:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.25);
        }

        .btn-row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 16px;
        }

        button {
            padding: 10px 18px;
            border: none;
            border-radius: 8px;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.2s;
        }

        .btn-success { background: #059669; color: white; }
        .btn-primary { background: var(--primary); color: white; }
        .btn-secondary { background: #374151; color: #e5e7eb; }
        .btn-warning { background: #d97706; color: white; }
        .btn-danger { background: #dc2626; color: white; }

        .output-box {
            background: #060911;
            border: 1px solid #1f2937;
            border-radius: 10px;
            padding: 16px;
            font-family: 'Fira Code', monospace;
            font-size: 0.85rem;
            color: #a5f3fc;
            overflow-x: auto;
            max-height: 300px;
            margin-top: 18px;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <div class="logo-area">
                <h1>📋 Attendance Backend (POST, GET, PUT, DELETE)</h1>
                <p style="color: var(--text-muted); font-size: 0.85rem; margin-top: 4px;">Fields: employeeId, name, manager, isAvailable, attendanceDate</p>
            </div>
            <div class="status-badge">
                <span class="status-dot"></span>
                <span>Live Server</span>
            </div>
        </header>

        <div class="card">
            <div class="card-header">
                <h2>⚡ Interactive Testing Console</h2>
            </div>

            <div class="form-grid">
                <div class="form-group">
                    <label>Employee ID (employeeId)</label>
                    <input type="text" id="employeeId" value="EMP101">
                </div>
                <div class="form-group">
                    <label>Name (name)</label>
                    <input type="text" id="name" value="Ajay Kumar">
                </div>
                <div class="form-group">
                    <label>Manager (manager)</label>
                    <input type="text" id="manager" value="Rajesh Sharma">
                </div>
                <div class="form-group">
                    <label>Is Available (isAvailable)</label>
                    <select id="isAvailable">
                        <option value="true" selected>true (Present)</option>
                        <option value="false">false (Absent)</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>Attendance Date (attendanceDate)</label>
                <input type="date" id="attendanceDate">
            </div>

            <div class="btn-row">
                <button class="btn-success" onclick="postData()">➕ POST Attendance</button>
                <button class="btn-primary" onclick="getAllData()">📋 GET All</button>
                <button class="btn-secondary" onclick="getSingleData()">🔍 GET by ID</button>
                <button class="btn-warning" onclick="putData()">✏️ PUT Update</button>
                <button class="btn-danger" onclick="deleteData()">❌ DELETE</button>
            </div>

            <div style="margin-top: 18px; display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted);">
                <span>Response Output:</span>
                <span id="resStatus">Ready</span>
            </div>
            <div class="output-box" id="output">// Click any button above to test...</div>
        </div>
    </div>

    <script>
        const todayStr = new Date().toISOString().split('T')[0];
        document.getElementById('attendanceDate').value = todayStr;

        function showResult(status, data) {
            document.getElementById('resStatus').textContent = `Status: ${status}`;
            document.getElementById('output').textContent = JSON.stringify(data, null, 2);
        }

        // 1. POST
        async function postData() {
            const body = {
                employeeId: document.getElementById('employeeId').value.trim(),
                name: document.getElementById('name').value.trim(),
                manager: document.getElementById('manager').value.trim(),
                isAvailable: document.getElementById('isAvailable').value === 'true',
                attendanceDate: document.getElementById('attendanceDate').value
            };
            try {
                const res = await fetch('/api/attendance', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                showResult(res.status, data);
            } catch (err) {
                showResult('Error', { error: err.message });
            }
        }

        // 2. GET ALL
        async function getAllData() {
            try {
                const res = await fetch('/api/attendance');
                const data = await res.json();
                showResult(res.status, data);
            } catch (err) {
                showResult('Error', { error: err.message });
            }
        }

        // 3. GET SINGLE
        async function getSingleData() {
            const id = document.getElementById('employeeId').value.trim();
            try {
                const res = await fetch(`/api/attendance/${id}`);
                const data = await res.json();
                showResult(res.status, data);
            } catch (err) {
                showResult('Error', { error: err.message });
            }
        }

        // 4. PUT UPDATE
        async function putData() {
            const id = document.getElementById('employeeId').value.trim();
            const body = {
                name: document.getElementById('name').value.trim(),
                manager: document.getElementById('manager').value.trim(),
                isAvailable: document.getElementById('isAvailable').value === 'true',
                attendanceDate: document.getElementById('attendanceDate').value
            };
            try {
                const res = await fetch(`/api/attendance/${id}`, {
                    method: 'PUT',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(body)
                });
                const data = await res.json();
                showResult(res.status, data);
            } catch (err) {
                showResult('Error', { error: err.message });
            }
        }

        // 5. DELETE
        async function deleteData() {
            const id = document.getElementById('employeeId').value.trim();
            if (!confirm(`Delete attendance of ${id}?`)) return;
            try {
                const res = await fetch(`/api/attendance/${id}`, { method: 'DELETE' });
                const data = await res.json();
                showResult(res.status, data);
            } catch (err) {
                showResult('Error', { error: err.message });
            }
        }
    </script>
</body>
</html>
